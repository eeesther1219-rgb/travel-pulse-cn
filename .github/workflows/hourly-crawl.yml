name: Hourly TopHub crawl
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run crawl
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: refresh hourly TopHub lists'
          file_pattern: data/latest.json
